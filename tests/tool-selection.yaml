# =============================================================================
# Eval 5: Cosmos DB — Container Query
# =============================================================================
- vars:
    query: >-
      Query all orders placed in the last 24 hours from the 'orders' container
      in database 'ecommerce' on Cosmos DB account 'mycosmosdb'
  assert:
    - type: is-valid-openai-tools-call
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const cosmosCall = calls.find(c => c.function.name === 'cosmos');
        if (!cosmosCall) return { pass: false, reason: 'Expected cosmos tool to be called' };
        const args = JSON.parse(cosmosCall.function.arguments);
        if (args.command && args.command !== 'cosmos_database_container_item_query') {
          return { pass: false, reason: `Expected command cosmos_database_container_item_query, got ${args.command}` };
        }
        return { pass: true, reason: 'Correctly selected cosmos tool for container query' };
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const cosmosCall = calls.find(c => c.function.name === 'cosmos');
        if (!cosmosCall) return { pass: false, reason: 'No cosmos call found' };
        const argsStr = cosmosCall.function.arguments;
        const hasAccount = argsStr.toLowerCase().includes('mycosmosdb');
        const hasDb = argsStr.toLowerCase().includes('ecommerce');
        const hasContainer = argsStr.toLowerCase().includes('orders');
        if (!hasAccount) return { pass: false, reason: 'Expected account mycosmosdb in arguments' };
        if (!hasDb) return { pass: false, reason: 'Expected database ecommerce in arguments' };
        if (!hasContainer) return { pass: false, reason: 'Expected container orders in arguments' };
        return { pass: true, reason: 'Account, database, and container correctly provided' };

# =============================================================================
# Eval 6: Monitor — Log Analytics Query
# =============================================================================
- vars:
    query: >-
      Run a KQL query against my Log Analytics workspace 'prod-logs' to find
      all requests that returned a 500 status code in the last hour
  assert:
    - type: is-valid-openai-tools-call
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const monitorCall = calls.find(c => c.function.name === 'monitor');
        if (!monitorCall) return { pass: false, reason: 'Expected monitor tool to be called' };
        const args = JSON.parse(monitorCall.function.arguments);
        const validCommands = ['monitor_workspace_log_query', 'monitor_resource_log_query'];
        if (args.command && !validCommands.includes(args.command)) {
          return { pass: false, reason: `Expected a log query command, got ${args.command}` };
        }
        return { pass: true, reason: 'Correctly selected monitor tool for log query' };
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const monitorCall = calls.find(c => c.function.name === 'monitor');
        if (!monitorCall) return { pass: false, reason: 'No monitor call found' };
        const argsStr = monitorCall.function.arguments;
        const hasWorkspace = argsStr.toLowerCase().includes('prod-logs');
        if (!hasWorkspace) return { pass: false, reason: 'Expected workspace prod-logs in arguments' };
        return { pass: true, reason: 'Workspace reference correctly provided' };

