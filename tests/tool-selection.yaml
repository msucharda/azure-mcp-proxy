# =============================================================================
# Eval 10: Multi-Tool — Subscription + Compute Cross-Service
# =============================================================================
- vars:
    query: >-
      First list all my Azure subscriptions, then list the virtual machines
      in the default subscription's 'main-rg' resource group
  assert:
    - type: is-valid-openai-tools-call
    - type: tool-call-f1
      value:
        - subscription_list
        - compute
      threshold: 0.5
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const subCall = calls.find(c => c.function.name === 'subscription_list');
        const computeCall = calls.find(c => c.function.name === 'compute');
        if (!subCall && !computeCall) {
          return { pass: false, reason: 'Expected at least subscription_list or compute to be called' };
        }
        if (subCall && computeCall) {
          return { pass: true, reason: 'Both subscription_list and compute tools correctly selected' };
        }
        if (subCall) {
          return { pass: true, reason: 'subscription_list selected (compute may follow in next turn)' };
        }
        return { pass: true, reason: 'compute selected (may have implicit subscription context)' };
