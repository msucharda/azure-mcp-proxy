# Azure MCP Proxy — Tool Selection Eval Cases
# 10 evals covering compute, storage, keyvault, AKS, Cosmos DB, monitor,
# app service, container apps, resource groups, and multi-tool scenarios.

# =============================================================================
# Eval 1: Compute — VM Listing
# =============================================================================
- vars:
    query: "List all virtual machines in my production resource group called 'prod-rg'"
  assert:
    - type: is-valid-openai-tools-call
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const computeCall = calls.find(c => c.function.name === 'compute');
        if (!computeCall) return { pass: false, reason: 'Expected compute tool to be called' };
        const args = JSON.parse(computeCall.function.arguments);
        if (args.command && args.command !== 'compute_vm_get') {
          return { pass: false, reason: `Expected command compute_vm_get, got ${args.command}` };
        }
        return { pass: true, reason: 'Correctly selected compute tool for VM listing' };
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const computeCall = calls.find(c => c.function.name === 'compute');
        if (!computeCall) return { pass: false, reason: 'No compute call found' };
        const args = JSON.parse(computeCall.function.arguments);
        const params = args.parameters || args;
        const rgValue = params['resource-group'] || params.resourceGroup;
        if (!rgValue) return { pass: false, reason: 'Expected resource-group parameter to be provided' };
        return { pass: true, reason: `resource-group parameter present: ${rgValue}` };

# =============================================================================
# Eval 2: Storage — Blob Container Creation
# =============================================================================
- vars:
    query: "Create a new blob container called 'backups' in my storage account 'prodstore'"
  assert:
    - type: is-valid-openai-tools-call
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const storageCall = calls.find(c => c.function.name === 'storage');
        if (!storageCall) return { pass: false, reason: 'Expected storage tool to be called' };
        const args = JSON.parse(storageCall.function.arguments);
        if (args.command && !args.command.includes('container_create') && !args.command.includes('blob_container')) {
          return { pass: false, reason: `Expected a container creation command, got ${args.command}` };
        }
        return { pass: true, reason: 'Correctly selected storage tool for blob container creation' };
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const storageCall = calls.find(c => c.function.name === 'storage');
        if (!storageCall) return { pass: false, reason: 'No storage call found' };
        const args = JSON.parse(storageCall.function.arguments);
        const params = args.parameters || args;
        const hasAccount = params.account || JSON.stringify(params).toLowerCase().includes('prodstore');
        const hasContainer = params.container || JSON.stringify(params).toLowerCase().includes('backups');
        if (!hasAccount) return { pass: false, reason: 'Expected storage account name to be included' };
        if (!hasContainer) return { pass: false, reason: 'Expected container name to be included' };
        return { pass: true, reason: 'Account and container parameters correctly provided' };

# =============================================================================
# Eval 3: Key Vault — Secret Retrieval
# =============================================================================
- vars:
    query: "Get the database connection string secret called 'db-conn-str' from key vault 'myapp-kv'"
  assert:
    - type: is-valid-openai-tools-call
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const kvCall = calls.find(c => c.function.name === 'keyvault');
        if (!kvCall) return { pass: false, reason: 'Expected keyvault tool to be called' };
        const args = JSON.parse(kvCall.function.arguments);
        if (args.command && args.command !== 'keyvault_secret_get') {
          return { pass: false, reason: `Expected command keyvault_secret_get, got ${args.command}` };
        }
        return { pass: true, reason: 'Correctly selected keyvault tool for secret retrieval' };
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const kvCall = calls.find(c => c.function.name === 'keyvault');
        if (!kvCall) return { pass: false, reason: 'No keyvault call found' };
        const argsStr = kvCall.function.arguments;
        const hasVault = argsStr.toLowerCase().includes('myapp-kv');
        const hasSecret = argsStr.toLowerCase().includes('db-conn-str');
        if (!hasVault) return { pass: false, reason: 'Expected vault name myapp-kv in arguments' };
        if (!hasSecret) return { pass: false, reason: 'Expected secret name db-conn-str in arguments' };
        return { pass: true, reason: 'Vault name and secret name correctly provided' };

