schema_version = "1.1"

[task]
name = "azure-mcp-evals/cosmos-db-query"
description = "Test that the agent selects the Cosmos DB tool to query a container"
authors = [{ name = "Azure MCP Eval Team" }]
keywords = ["cosmos", "database", "query"]

[metadata]
category = "tool-selection"
difficulty_explanation = "Agent must select the correct Azure MCP tool from 60+ available tools"

[verifier]
timeout_sec = 60.0
user = "root"

[agent]
timeout_sec = 300.0
user = "agent"

[environment]
build_timeout_sec = 300.0
docker_image = "ubuntu:24.04"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
env = { AZURE_MCP_URL = "${AZURE_MCP_URL}" }

[[environment.mcp_servers]]
name = "azure-mcp"
transport = "streamable-http"
url = "${AZURE_MCP_URL}"
