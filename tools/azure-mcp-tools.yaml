# Azure MCP Tool Definitions for Promptfoo Evals
# These are OpenAI-style function/tool definitions representing the Azure MCP proxy surface area.
# Includes 15 tools: 10 targets for eval scenarios + 5 distractors.

- type: function
  function:
    name: compute
    description: >-
      Compute operations — manage and monitor Azure Virtual Machines (VMs),
      Virtual Machine Scale Sets (VMSS), and Managed Disks. Supports listing,
      creating, updating, and deleting VMs and VMSS. Use sub-commands like
      compute_vm_get, compute_vm_create, compute_vmss_get, compute_disk_get, etc.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the compute operation to perform.
        command:
          type: string
          description: >-
            Sub-command to execute: compute_vm_get, compute_vm_create,
            compute_vm_update, compute_vm_delete, compute_vmss_get,
            compute_vmss_create, compute_disk_get, compute_disk_create.
          enum:
            - compute_vm_get
            - compute_vm_create
            - compute_vm_update
            - compute_vm_delete
            - compute_vmss_get
            - compute_vmss_create
            - compute_vmss_update
            - compute_vmss_delete
            - compute_disk_get
            - compute_disk_create
            - compute_disk_update
            - compute_disk_delete
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            resource-group:
              type: string
              description: Azure resource group name.
            name:
              type: string
              description: VM, VMSS, or disk name.
      required:
        - intent

- type: function
  function:
    name: storage
    description: >-
      Storage operations — create, list, get, and manage Azure Storage accounts,
      blob containers, blobs, and tables. Sub-commands include storage_account_create,
      storage_account_get, storage_blob_get, storage_blob_upload,
      storage_blob_container_create, storage_blob_container_get, storage_table_list.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the storage operation to perform.
        command:
          type: string
          description: >-
            Sub-command to execute.
          enum:
            - storage_account_create
            - storage_account_get
            - storage_blob_get
            - storage_blob_upload
            - storage_blob_container_create
            - storage_blob_container_get
            - storage_table_list
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            resource-group:
              type: string
              description: Azure resource group name.
            account:
              type: string
              description: Storage account name.
            container:
              type: string
              description: Blob container name.
      required:
        - intent

- type: function
  function:
    name: keyvault
    description: >-
      Key Vault operations — manage and access Azure Key Vault resources including
      keys, secrets, certificates, and vault admin settings. Sub-commands include
      keyvault_key_get, keyvault_key_create, keyvault_secret_get, keyvault_secret_create,
      keyvault_certificate_get, keyvault_certificate_create, keyvault_certificate_import,
      keyvault_admin_settings_get.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the key vault operation to perform.
        command:
          type: string
          description: Sub-command to execute.
          enum:
            - keyvault_key_get
            - keyvault_key_create
            - keyvault_secret_get
            - keyvault_secret_create
            - keyvault_certificate_get
            - keyvault_certificate_create
            - keyvault_certificate_import
            - keyvault_admin_settings_get
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            vault-name:
              type: string
              description: Key vault name.
            name:
              type: string
              description: Key, secret, or certificate name.
      required:
        - intent

- type: function
  function:
    name: aks
    description: >-
      Azure Kubernetes Service operations — manage and query AKS clusters and
      node pools across subscriptions. Sub-commands: aks_cluster_get, aks_nodepool_get.
      Not for kubectl execution or in-cluster application deployments.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the AKS operation to perform.
        command:
          type: string
          description: Sub-command to execute.
          enum:
            - aks_cluster_get
            - aks_nodepool_get
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            resource-group:
              type: string
              description: Azure resource group name.
            cluster:
              type: string
              description: AKS cluster name.
            nodepool:
              type: string
              description: Node pool name.
      required:
        - intent

- type: function
  function:
    name: cosmos
    description: >-
      Cosmos DB operations — manage and query Azure Cosmos DB resources including
      accounts, databases, containers, and document queries. Sub-commands:
      cosmos_list (list accounts/databases/containers),
      cosmos_database_container_item_query (query items with SQL).
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the Cosmos DB operation to perform.
        command:
          type: string
          description: Sub-command to execute.
          enum:
            - cosmos_list
            - cosmos_database_container_item_query
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            account:
              type: string
              description: Cosmos DB account name.
            database:
              type: string
              description: Database name.
            container:
              type: string
              description: Container name.
            query:
              type: string
              description: SQL query to execute against the container.
      required:
        - intent

- type: function
  function:
    name: monitor
    description: >-
      Azure Monitor operations — query and analyze Azure Monitor logs and metrics.
      Sub-commands include monitor_workspace_list, monitor_workspace_log_query,
      monitor_resource_log_query, monitor_metrics_query, monitor_metrics_definitions,
      monitor_activitylog_list, monitor_table_list, monitor_healthmodels_entity_get.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the monitor operation to perform.
        command:
          type: string
          description: Sub-command to execute.
          enum:
            - monitor_workspace_list
            - monitor_workspace_log_query
            - monitor_resource_log_query
            - monitor_table_list
            - monitor_table_type_list
            - monitor_metrics_query
            - monitor_metrics_definitions
            - monitor_activitylog_list
            - monitor_healthmodels_entity_get
            - monitor_webtests_get
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            resource-group:
              type: string
              description: Azure resource group name.
            workspace:
              type: string
              description: Log Analytics workspace name or ID.
            query:
              type: string
              description: KQL query to execute.
            resource-uri:
              type: string
              description: Azure resource URI for metrics/logs.
      required:
        - intent

