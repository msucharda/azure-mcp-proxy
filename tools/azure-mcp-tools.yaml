- type: function
  function:
    name: containerapps
    description: >-
      Azure Container Apps operations — list and manage Azure Container Apps resources.
      Sub-commands: containerapps_list.
    parameters:
      type: object
      properties:
        intent:
          type: string
          description: The intent of the container apps operation to perform.
        command:
          type: string
          description: Sub-command to execute.
          enum:
            - containerapps_list
        parameters:
          type: object
          description: Parameters for the sub-command.
          properties:
            subscription:
              type: string
              description: Azure subscription ID or display name.
            resource-group:
              type: string
              description: Azure resource group name.
      required:
        - intent

- type: function
  function:
    name: subscription_list
    description: >-
      List all Azure subscriptions for the current account. Returns subscriptionId,
      displayName, state, tenantId, and isDefault for each subscription.
    parameters:
      type: object
      properties:
        tenant:
          type: string
          description: The Microsoft Entra ID tenant ID or name.

- type: function
  function:
    name: group_list
    description: >-
      List all resource groups in a subscription. Returns resource group names and IDs.
    parameters:
      type: object
      properties:
        subscription:
          type: string
          description: Azure subscription ID or display name.

- type: function
  function:
    name: group_resource_list
    description: >-
      List all resources in a resource group. Returns resource names, IDs, types,
      and locations.
    parameters:
      type: object
      properties:
        subscription:
          type: string
          description: Azure subscription ID or display name.
        resource-group:
          type: string
          description: Azure resource group name.
      required:
        - resource-group

